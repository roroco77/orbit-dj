name: Build Myspoti crossfade fix

on:
  push:
    branches:
      - myspoti-crossfade-build
    paths:
      - 'crossfade-fix/myspoti-crossfade-fix.patch'
      - '.github/workflows/build-myspoti-crossfade.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile patched Myspoti APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out patch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Fetch upstream Myspoti source
        run: git clone --depth 1 --branch main https://github.com/kota-zo/myspoti.git myspoti-src

      - name: Apply crossfade fix
        run: |
          git -C myspoti-src apply --check "$GITHUB_WORKSPACE/crossfade-fix/myspoti-crossfade-fix.patch"
          git -C myspoti-src apply "$GITHUB_WORKSPACE/crossfade-fix/myspoti-crossfade-fix.patch"
          echo "Patched source commit:"
          git -C myspoti-src rev-parse HEAD
          echo "Applied change:"
          grep -n -A12 -B3 "Spotify's Web Player may omit" myspoti-src/base/api-spotify/src/main/kotlin/app/myspoti/spotify/SpotifyPlayer.kt

      - name: Compile APK
        working-directory: myspoti-src/base
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: myspoti-crossfade-fix-debug-apk
          path: myspoti-src/base/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests after publishing APK artifact
        if: always()
        continue-on-error: true
        working-directory: myspoti-src/base
        run: ./gradlew --no-daemon testDebugUnitTest
